name: Tag on merge to main

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  bump-minor:
    name: Bump minor version and create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump minor version and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/bump-tag.sh minor
